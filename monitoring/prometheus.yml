global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: spring-jpa-lab

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
